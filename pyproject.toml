[project]
name = "maf-llm"
version = "0.1.0"
description = "Shared multi-provider LLM client library"
requires-python = ">=3.12"
dependencies = [
    "httpcore>=1.0.9,<1.1.0",
    "httpx>=0.28.0,<0.29.0",
    "pydantic>=2.10.0",
    "openai>=1.60.0,<2.0.0",
    "anthropic>=0.40.0,<0.121.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maf_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]
